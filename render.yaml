services:
  - type: web
    name: techbigsolutions-node-api
    runtime: node
    region: singapore   # change to: oregon | frankfurt | ohio | virginia as needed
    plan: free          # upgrade to starter/standard for production SLAs

    buildCommand: npm install
    startCommand: npm start

    # Render injects PORT automatically — no need to set it here
    envVars:
      - key: NODE_ENV
        value: production

      # ── Database ──────────────────────────────────────────────────────────
      # Point these at your hosted MySQL provider (PlanetScale, Aiven, Railway…)
      - key: DB_HOST
        sync: false   # set in Render dashboard — never commit real values
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Set to "false" only if your MySQL host does NOT support SSL
      - key: DB_SSL
        value: "true"
      - key: DB_CONNECTION_LIMIT
        value: "10"

      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: JWT_EXPIRES_IN
        value: "1d"

      # ── CORS ──────────────────────────────────────────────────────────────
      # Comma-separated list of allowed frontend origins
      - key: ALLOWED_ORIGINS
        sync: false   # e.g. https://yourapp.vercel.app,https://www.yourdomain.com

    healthCheckPath: /api/health
