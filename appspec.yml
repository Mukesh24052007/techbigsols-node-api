# ── AWS CodeDeploy application specification ──────────────────────────────────
# Used when deploying to EC2 / on-premises instances via CodeDeploy.
# For ECS deployments, replace the 'version' block with ECS task-definition hooks.

version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/app
    overwrite: true

permissions:
  - object: /home/ec2-user/app
    owner: ec2-user
    group: ec2-user
    mode: "755"
    type:
      - directory
  - object: /home/ec2-user/app/src
    owner: ec2-user
    group: ec2-user
    mode: "644"
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 60
      runas: ec2-user

  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 60
      runas: ec2-user

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 30
      runas: ec2-user
